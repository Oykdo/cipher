name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this manual run? (artifacts only, no release publish)'
        required: false
        default: 'manual test'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned on purpose. The frozen cipher-runtime carries a measured
          # glibc floor of 2.35, and the smoke test below EXECUTES it: an
          # unpinned ubuntu-latest would move to 26.04 one day and change
          # what that execution proves without anyone editing this file.
          - os: ubuntu-24.04
            builder_flag: --linux
            artifact_name: cipher-linux
            artifact_glob: |
              release/*.AppImage
              release/*.deb
              release/SHA256SUMS-linux.txt
          - os: windows-latest
            builder_flag: --win
            artifact_name: cipher-windows
            artifact_glob: |
              release/*.exe
              release/SHA256SUMS-windows.txt

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # No Eidolon checkout: the Genesis ceremony ships as a frozen binary
      # (cipher-runtime), downloaded from an Eidolon release and SHA-256
      # verified by bundle-eidolon-runtime.mjs. The ceremony still runs on the
      # user's machine — it mints the master seed and must never run
      # server-side — but Cipher no longer needs the Eidolon source to build.

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/bridge/package-lock.json
            apps/frontend/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install bridge deps
        run: npm ci
        working-directory: apps/bridge

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/frontend

      - name: Build frontend + bridge
        run: npm run build:all

      - name: Bundle Eidolon ceremony runtime
        run: npm run bundle:eidolon
        env:
          EIDOLON_ROOT: ${{ github.workspace }}/eidolon-src

      # Until v1.4.0 this asserted on assets/eidolon-runtime/src/crypto/...py,
      # the staged Python tree. In CI that file could never exist: the public
      # Oykdo/Eidolon repo holds src/__init__.py, src/daemon/ and
      # src/protocols/ and no crypto core, so the bundler warned, returned 0,
      # and the step went red on every tag. The ceremony now ships as a frozen
      # binary instead, so this asserts on the binary.
      #
      # It runs BEFORE electron-builder and covers BOTH matrix legs: with
      # fail-fast: false, checking after packaging let the Windows leg publish
      # a Cipher-Setup-*.exe whose Genesis signup cannot work while Linux went
      # red.
      - name: Assert ceremony runtime was actually staged
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Windows) CEREMONY=assets/eidolon-runtime/cipher-runtime.exe ;;
            *)       CEREMONY=assets/eidolon-runtime/cipher-runtime ;;
          esac
          if [ ! -f "$CEREMONY" ]; then
            echo "::error::Frozen ceremony runtime not staged ($CEREMONY). bundle:eidolon did not produce it, so this build would ship an installer that cannot create an account."
            echo "--- assets/eidolon-runtime ---"
            ls -la assets/eidolon-runtime 2>/dev/null || echo "(absent)"
            exit 1
          fi
          echo "Ceremony runtime staged at $CEREMONY"
          # Presence is not enough: a truncated download or a runtime built
          # against a newer glibc than this runner leaves a file that exists
          # and cannot run. Execute it the way main.js does.
          chmod +x "$CEREMONY"
          RUNTIME_VERSION="$("$CEREMONY" --version)"
          [ -n "$RUNTIME_VERSION" ] || { echo "::error::cipher-runtime --version printed nothing"; exit 1; }
          echo "cipher-runtime --version -> ${RUNTIME_VERSION}"

      # Always build with --publish never. The release upload is done in
      # the separate "Publish to GitHub Release" step below so the Windows
      # .exe can be code-signed in between (the previous --publish always
      # approach would have uploaded the unsigned binary directly).
      - name: Package with electron-builder
        shell: bash
        run: |
          npx electron-builder ${{ matrix.builder_flag }} --publish never

      # Sign the Windows installer with Azure Trusted Signing.
      # Skipped silently until the repo variable AZURE_SIGNING_ENABLED is
      # set to 'true' (so existing builds keep working before an Azure
      # Trusted Signing account is provisioned). See
      # docs/azure-trusted-signing.md for the full setup procedure +
      # the list of secrets / variables this step expects.
      - name: Sign Windows installer (Azure Trusted Signing)
        if: matrix.os == 'windows-latest' && vars.AZURE_SIGNING_ENABLED == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Smoke test Linux artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd release
          APPIMAGE=$(ls *.AppImage 2>/dev/null | head -1 || true)
          DEB=$(ls *.deb 2>/dev/null | head -1 || true)
          if [ -z "$APPIMAGE" ] || [ -z "$DEB" ]; then
            echo "::error::Missing artifact (AppImage='$APPIMAGE' deb='$DEB')"
            ls -la
            exit 1
          fi
          APPIMAGE_SIZE=$(stat -c%s "$APPIMAGE")
          DEB_SIZE=$(stat -c%s "$DEB")
          echo "AppImage: $APPIMAGE ($APPIMAGE_SIZE bytes)"
          echo "deb:      $DEB ($DEB_SIZE bytes)"
          # An Electron bundle is always >30MB; anything smaller means the
          # packager truncated or skipped the embedded chromium.
          if [ "$APPIMAGE_SIZE" -lt 30000000 ]; then
            echo "::error::AppImage suspiciously small (<30MB) — likely truncated"
            exit 1
          fi
          if [ "$DEB_SIZE" -lt 30000000 ]; then
            echo "::error::deb suspiciously small (<30MB) — likely truncated"
            exit 1
          fi
          chmod +x "$APPIMAGE"
          ./"$APPIMAGE" --appimage-extract > /dev/null
          test -f squashfs-root/AppRun
          echo "✓ AppImage extracts cleanly and contains AppRun"
          # The ceremony entry point must be inside the bundle, or signup
          # dies at the Genesis screen on a machine with no Eidolon checkout.
          CEREMONY=squashfs-root/resources/Eidolon/cipher-runtime
          if [ ! -f "$CEREMONY" ]; then
            echo "::error::Ceremony runtime missing from AppImage ($CEREMONY)"
            exit 1
          fi
          echo "✓ Genesis ceremony runtime present in bundle"
          # Until v1.4.1 this stopped at "the file exists". It could not tell a
          # runtime that runs from one that dies in the dynamic loader, which
          # is exactly how a glibc floor violation presents. Run it from the
          # extracted image, as the installed app would.
          chmod +x "$CEREMONY"
          RUNTIME_VERSION="$("$CEREMONY" --version)"
          [ -n "$RUNTIME_VERSION" ] || { echo "::error::cipher-runtime --version printed nothing"; exit 1; }
          echo "✓ cipher-runtime executes from the AppImage (--version -> ${RUNTIME_VERSION})"
          # The .deb must carry the floor the runtime was measured at, so apt
          # refuses cleanly on an older glibc instead of the ceremony dying in
          # an opaque loader error at signup.
          DEB_DEPENDS="$(dpkg-deb -f "$DEB" Depends)"
          echo "deb Depends: ${DEB_DEPENDS}"
          case "$DEB_DEPENDS" in
            *"libc6 (>= 2.35)"*) echo "✓ deb declares libc6 (>= 2.35)" ;;
            *) echo "::error::deb does not declare libc6 (>= 2.35)"; exit 1 ;;
          esac

      # Generate a per-platform checksum file next to the binaries so a
      # tester can verify their download with `sha256sum -c` (Linux) or
      # `Get-FileHash` (Windows). Standard one-line-per-file format. Both
      # runners ship coreutils' sha256sum (Linux native + Git Bash on
      # windows-latest), so the same script runs on both jobs.
      #
      # The file name carries the platform. Until v1.4.3 both legs uploaded
      # `SHA256SUMS.txt` to the same release and the second upload replaced
      # the first: v1.4.3 shipped a checksum file listing the AppImage and
      # the deb, and nothing for Cipher-Setup-1.4.3.exe.
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release
          case "${RUNNER_OS}" in
            Linux)   sha256sum *.AppImage *.deb > SHA256SUMS-linux.txt ;;
            Windows) sha256sum *.exe > SHA256SUMS-windows.txt ;;
            *) echo "::error::Unsupported runner OS: ${RUNNER_OS}"; exit 1 ;;
          esac
          echo "::group::SHA256SUMS"
          cat SHA256SUMS-*.txt
          echo "::endgroup::"

      # Publish to the GitHub Release on tag push. Replaces the previous
      # `--publish always` flag on electron-builder so the SIGNED Windows
      # .exe lands in the release rather than the unsigned one. Linux
      # artifacts (.AppImage, .deb) ride along through the same step.
      - name: Publish to GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_glob }}
          fail_on_unmatched_files: true

      - name: Upload artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14
